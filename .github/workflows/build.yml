name: Build and Release AppImage

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for pywebview and AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgirepository1.0-dev \
            gir1.2-webkit2-4.1 \
            curl \
            file \
            zlib1g-dev

      - name: Install Python build requirements
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh linux/AppRun
          ./build_appimage.sh

      - name: Verify AppImage binary
        run: |
          ls -lh NavigatorZnanij-x86_64.AppImage
          file NavigatorZnanij-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavigatorZnanij-x86_64.AppImage
          path: NavigatorZnanij-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NavigatorZnanij-x86_64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
